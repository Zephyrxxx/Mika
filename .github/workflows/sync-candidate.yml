name: Prepare sync candidate
on:
  workflow_call:
    inputs:
      head: {type: string, required: true}
      base: {type: string, required: true}
      upstream: {type: string, required: true}
      iteration: {type: number, required: true}
    secrets:
      api_key: {required: true}
permissions: {contents: read, actions: read}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HEAD_SHA: ${{ inputs.head }}
      BASE_SHA: ${{ inputs.base }}
      UP_SHA: ${{ inputs.upstream }}
    steps:
      - uses: actions/checkout@v7
        with: {path: control, ref: '${{ inputs.base }}', persist-credentials: false}
      - uses: actions/checkout@v7
        with: {path: candidate, ref: '${{ inputs.head }}', fetch-depth: 0, persist-credentials: false}
      - name: Incorporate current main
        working-directory: candidate
        run: bash ../control/.github/scripts/merge-target.sh "$BASE_SHA"
      - name: Prepare upstream merge if main is already resolved
        working-directory: candidate
        run: |
          if ! git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            bash ../control/.github/scripts/merge-target.sh "$UP_SHA"
          fi
      - name: Collect failed job diagnostics for a retry
        if: inputs.iteration == 2
        env: {GH_TOKEN: '${{ github.token }}'}
        working-directory: candidate
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[]|select(.conclusion=="failure")|.id' > "$RUNNER_TEMP/jobs"
          while read -r id; do
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" | tail -c 24000 >> "$RUNNER_TEMP/failed-ci.log"
          done < "$RUNNER_TEMP/jobs"
          cp "$RUNNER_TEMP/failed-ci.log" .failed-ci.log
      - name: Check semantic compatibility and resolve upstream conflicts
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675
        with:
          openai-api-key: ${{ secrets.api_key }}
          working-directory: candidate
          prompt-file: ${{ github.workspace }}/control/.github/codex/upstream-sync.md
          output-schema-file: ${{ github.workspace }}/control/.github/codex/result.json
          output-file: ${{ runner.temp }}/review.json
          safety-strategy: drop-sudo
          sandbox: workspace-write
      - name: Export reviewed candidate
        working-directory: candidate
        run: |
          set -eu
          jq -e '.ready == true' "$RUNNER_TEMP/review.json"
          rm -f .failed-ci.log
          printf '%s\n' "$UP_SHA" > .github/sync-target
          git add -A
          git diff --cached --check
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then git commit --no-edit
          elif ! git diff --cached --quiet; then git commit -m "Preserve custom behavior during upstream sync"; fi
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git merge-base --is-ancestor "$UP_SHA" HEAD
          git branch -f reviewed HEAD
          if [[ $(git rev-parse HEAD) == "$HEAD_SHA" ]]; then
            git bundle create "$RUNNER_TEMP/candidate.bundle" reviewed --since=1970-01-01
          else
            git bundle create "$RUNNER_TEMP/candidate.bundle" reviewed "^$HEAD_SHA"
          fi
          # A retry with no new commit cannot fix a failed run.
      - uses: actions/upload-artifact@v7
        with:
          name: sync-${{ inputs.iteration }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate.bundle
          retention-days: 2
